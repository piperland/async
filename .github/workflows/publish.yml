# Piper Async — npm release workflow (trusted publishing).
# Manual trigger ONLY. Prerelease-only for the beta phase.
#
# Security model:
#   - GitHub Actions OIDC + npm Trusted Publishing (`npm trust github`).
#     NO long-lived npm token, NO NODE_AUTH_TOKEN / NPM_TOKEN secret.
#   - setup-node with registry-url generates the publish token from the OIDC
#     identity (id-token: write). npm publish authenticates via that
#     short-lived token.
#   - Filename `publish.yml` is a TRUST INVARIANT: the npm trusted-publisher
#     config is bound to this exact filename. Do not rename the workflow
#     without reconfiguring npm trust.
#   - No package-manager caching in the release job (release security > speed).
#
# Guards (all enforced by scripts/release-guard.mjs, tested in
# test/release-guard.test.ts):
#   - existing-version guard: refuses to publish a version already on npm
#     (versions are immutable).
#   - stable-version guard: refuses non-prerelease versions (beta phase).
#   - prerelease-tag guard: any prerelease publishes with --tag beta, never latest.
#   - source check: refuses a run from any repository other than piperland/async.

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate package source
        run: |
          node -e "const p = require('./package.json');
            if (p.name !== '@piperland/async') throw new Error('unexpected name: ' + p.name);
            if (p.version !== '${{ inputs.version }}') { console.error('package.json version', p.version, '!= input', '${{ inputs.version }}'); process.exit(1); }"
      - name: Release guards
        run: node scripts/release-guard.mjs "${{ inputs.version }}" "${{ github.repository }}"
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Inspect pack
        run: pnpm pack --dry-run
      # Trusted publishing: setup-node sets NODE_AUTH_TOKEN from OIDC (no secret).
      # Prerelease => beta tag (never latest) per beta-phase policy.
      - name: Publish
        run: pnpm publish --access public --tag beta --no-git-checks
      - name: Verify dist-tags
        run: npm view @piperland/async dist-tags --json
