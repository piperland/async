# Piper Async — npm release workflow (trusted publishing).
# Manual trigger ONLY. Does NOT publish automatically.
# After the package exists on npm (bootstrapped via the first manual publish),
# configure this workflow as the npm Trusted Publisher for @piperland/async
# (provider: GitHub Actions; workflow: publish.yml).
#
# Security model:
#   - GitHub Actions OIDC + npm Trusted Publishing. NO long-lived npm token,
#     NO npm token in GitHub Secrets.
#   - setup-node with registry-url generates the auth token from the OIDC
#     identity (id-token: write). npm publish then authenticates via that
#     short-lived token.
#   - Explicit workflow_dispatch — no auto-publish from normal commits.

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-beta.1)'
        required: true
        type: string
      distTag:
        description: 'npm dist-tag (default: beta)'
        required: false
        default: 'beta'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate version matches input
        run: node -e "const p=require('./package.json'); if (p.version !== '${{ inputs.version }}') { console.error('package.json version', p.version, '!= input', '${{ inputs.version }}'); process.exit(1); }"
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Trusted publishing: setup-node sets NODE_AUTH_TOKEN from OIDC (no secret).
      - name: Publish
        run: pnpm publish --access public --tag "${{ inputs.distTag }}" --no-git-checks
      - name: Verify dist-tag
        run: npm view @piperland/async dist-tags --json
