name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:examples

  runtime-parity:
    name: runtime parity (node 20 / bun / deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Node current
      - name: parity (node 24)
        run: node test/runtime-parity.mjs

      # Node runtime floor (20.x) — build was done under Node 24 (dev floor);
      # the built ESM output is executed under the runtime floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: parity (node 20)
        run: node test/runtime-parity.mjs

      # Bun
      - uses: oven-sh/setup-bun@v2
      - name: parity (bun)
        run: bun test/runtime-parity.mjs

      # Deno
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: parity (deno)
        run: deno run --allow-read --allow-env --allow-sys test/runtime-parity.mjs

  package:
    name: package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --dry-run

  browser:
    name: browser semantic (chromium/firefox/webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: node test/browser/run-browser-test.mjs all

  bench-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A tiny benchmark smoke: all groups execute, semantic assertions pass,
      # results are finite. NO relative-performance gate (shared runners noisy).
      - run: node bench/map.bench.mjs > /tmp/bench-map.log && grep -q "ops/s" /tmp/bench-map.log
      - run: node bench/retry.bench.mjs > /tmp/bench-retry.log && grep -q "ops/s" /tmp/bench-retry.log
      - run: node bench/timeout.bench.mjs > /tmp/bench-timeout.log && grep -q "ops/s" /tmp/bench-timeout.log
      - run: node bench/race.bench.mjs > /tmp/bench-race.log && grep -q "ops/s" /tmp/bench-race.log
      - run: node bench/scope.bench.mjs > /tmp/bench-scope.log && grep -q "ops/s" /tmp/bench-scope.log

  workers:
    name: cloudflare workers runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run --config test/workers/vitest.workers.config.mts
